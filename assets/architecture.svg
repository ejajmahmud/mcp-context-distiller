<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="900" height="280" rx="16" fill="url(#bgGrad)" />

  <!-- Client Box -->
  <g filter="url(#shadow)">
    <rect x="50" y="70" width="200" height="140" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <text x="150" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#f8fafc" text-anchor="middle">MCP Client / LLM</text>
    <text x="150" y="145" font-family="monospace" font-size="12" fill="#94a3b8" text-anchor="middle">Claude / Antigravity</text>
    <text x="150" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#38bdf8" text-anchor="middle">Context Window</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 250 140 L 330 140" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6,4"/>
  <polygon points="330,135 345,140 330,145" fill="#38bdf8"/>

  <!-- Distiller Core Box -->
  <g filter="url(#shadow)">
    <rect x="350" y="50" width="260" height="180" rx="14" fill="#111827" stroke="url(#accentGrad)" stroke-width="3"/>
    <rect x="370" y="65" width="220" height="30" rx="6" fill="#1e293b"/>
    <text x="480" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#38bdf8" text-anchor="middle">⚡ MCP CONTEXT DISTILLER</text>
    <text x="480" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle">• AST Schema Compression</text>
    <text x="480" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle">• Dynamic Head/Tail Sampling</text>
    <text x="480" y="175" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle">• Zero-Overhead JSON-RPC Pipe</text>
    <rect x="370" y="195" width="220" height="24" rx="4" fill="#047857"/>
    <text x="480" y="211" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">-40% to -75% TOKEN REDUCTION</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 610 140 L 690 140" stroke="#818cf8" stroke-width="3" stroke-dasharray="6,4"/>
  <polygon points="690,135 705,140 690,145" fill="#818cf8"/>

  <!-- Server Box -->
  <g filter="url(#shadow)">
    <rect x="710" y="70" width="150" height="140" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <text x="785" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#f8fafc" text-anchor="middle">MCP Server</text>
    <text x="785" y="145" font-family="monospace" font-size="12" fill="#94a3b8" text-anchor="middle">Postgres / FS</text>
    <text x="785" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#818cf8" text-anchor="middle">Raw Verbose JSON</text>
  </g>
</svg>