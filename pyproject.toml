[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-context-distiller"
version = "0.1.0"
description = "High-performance context compressor and token condenser for Model Context Protocol (MCP) servers and AI agents"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
keywords = ["mcp", "model-context-protocol", "llm", "context-compression", "token-optimization", "ai-agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
mcp-distill = "mcp_context_distiller.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mcp_context_distiller*"]
